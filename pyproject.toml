[project]
name = "plymotion"
version = "0.1.0"
description = "Convert videos into Plymouth boot splash animations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "Pillow>=10.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pywebview>=6.2.1",
]

[project.scripts]
plymotion = "plymotion.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plymotion"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Domain exceptions read better without the Error suffix (NotFound, JobBusy, Cancelled).
ignore = ["N818"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
